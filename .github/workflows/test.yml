name: Windows Test

on: [push, pull_request]

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Go Vet
        run: go vet ./...

      - name: Build Windows Executable
        run: go build -v -o task.exe .

      - name: Test CLI Commands on Windows
        run: |
          .\task.exe add "First Windows Task"
          .\task.exe add "Second Windows Task"
          .\task.exe list
          .\task.exe done 1
          .\task.exe list
          .\task.exe delete 2
          .\task.exe list
